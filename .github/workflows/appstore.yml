name: Mac App Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      APP_NAME: TermaType
      BUNDLE_ID: org.terma.termatype
      TEAM_ID: ETM8V4BA5N
      SIGN_APP: "3rd Party Mac Developer Application: Thupten Chakrishar (ETM8V4BA5N)"
      SIGN_PKG: "3rd Party Mac Developer Installer: Thupten Chakrishar (ETM8V4BA5N)"

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          brew install cmake
          npm ci

      - name: Set up keychain and certificates
        env:
          MAC_APP_DIST_CERTIFICATE: ${{ secrets.MAC_APP_DIST_CERTIFICATE }}
          MAC_APP_DIST_CERTIFICATE_PASSWORD: ${{ secrets.MAC_APP_DIST_CERTIFICATE_PASSWORD }}
          MAC_INSTALLER_CERTIFICATE: ${{ secrets.MAC_INSTALLER_CERTIFICATE }}
          MAC_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="build.keychain"
          KEYCHAIN_PW="actions"

          # Create keychain, add to search list (don't replace), set no timeout
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"

          # Import App Distribution cert
          echo "$MAC_APP_DIST_CERTIFICATE" | base64 --decode > /tmp/mac_app.p12
          security import /tmp/mac_app.p12 -k "$KEYCHAIN" -P "$MAC_APP_DIST_CERTIFICATE_PASSWORD" -A
          rm /tmp/mac_app.p12

          # Import Installer cert
          echo "$MAC_INSTALLER_CERTIFICATE" | base64 --decode > /tmp/mac_installer.p12
          security import /tmp/mac_installer.p12 -k "$KEYCHAIN" -P "$MAC_INSTALLER_CERTIFICATE_PASSWORD" -A
          rm /tmp/mac_installer.p12

          # Allow all applications to access keys without prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"

          # Verify
          echo "=== Certificates ==="
          security find-identity -v "$KEYCHAIN"
          echo "=== Keychain search list ==="
          security list-keychains -d user

      - name: Verify provisioning profile
        run: |
          echo "=== Profile info ==="
          file src-tauri/TermaType_Mac_App_Store.provisionprofile
          ls -la src-tauri/TermaType_Mac_App_Store.provisionprofile
          security cms -D -i src-tauri/TermaType_Mac_App_Store.provisionprofile > /dev/null 2>&1 && echo "Profile signature VALID" || echo "Profile signature check skipped"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp src-tauri/TermaType_Mac_App_Store.provisionprofile "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Build x86_64
        timeout-minutes: 15
        run: npm run tauri -- build --no-bundle --target x86_64-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: "-"

      - name: Build aarch64
        timeout-minutes: 15
        run: npm run tauri -- build --no-bundle --target aarch64-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: "-"

      - name: Build frontend
        run: npm run build

      - name: Assemble and sign app
        run: |
          set -e

          echo "==> Creating universal binary..."
          mkdir -p universal
          lipo -create \
            src-tauri/target/x86_64-apple-darwin/release/termatype \
            src-tauri/target/aarch64-apple-darwin/release/termatype \
            -output universal/termatype
          file universal/termatype

          echo "==> Assembling .app bundle..."
          APP="${APP_NAME}.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp universal/termatype "$APP/Contents/MacOS/termatype"
          chmod +x "$APP/Contents/MacOS/termatype"

          cp -R src-tauri/resources/* "$APP/Contents/Resources/" 2>/dev/null || true
          cp src-tauri/icons/icon.icns "$APP/Contents/Resources/icon.icns" 2>/dev/null || true

          if [ -d "dist" ]; then
            cp -R dist "$APP/Contents/Resources/"
          fi

          cp src-tauri/TermaType_Mac_App_Store.provisionprofile "$APP/Contents/embedded.provisionprofile"

          # Info.plist with LSApplicationCategoryType
          /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string en" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ${APP_NAME}" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string termatype" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string icon" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string ${BUNDLE_ID}" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleInfoDictionaryVersion string 6.0" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string ${APP_NAME}" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 2.0.0" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 2.0.0" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 10.15" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationCategoryType string public.app-category.productivity" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$APP/Contents/Info.plist"

          echo "==> Signing app bundle..."
          security unlock-keychain -p actions build.keychain

          codesign --force --options runtime --timestamp \
            --sign "$SIGN_APP" \
            --entitlements src-tauri/Entitlements.plist \
            "$APP/Contents/MacOS/termatype"

          codesign --force --options runtime --timestamp \
            --sign "$SIGN_APP" \
            --entitlements src-tauri/Entitlements.plist \
            "$APP"

          echo "==> Verifying signature..."
          codesign --verify --deep --strict "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | head -20

      - name: Create and sign .pkg
        timeout-minutes: 5
        run: |
          security unlock-keychain -p actions build.keychain

          # Create unsigned pkg
          xcrun productbuild \
            --component "${APP_NAME}.app" /Applications \
            "unsigned.pkg"
          echo "Unsigned PKG: $(ls -lh unsigned.pkg)"

          # Sign with timeout — productsign can hang in CI
          if timeout 120 xcrun productsign \
            --sign "$SIGN_PKG" \
            "unsigned.pkg" "${APP_NAME}.pkg"; then
            echo "PKG signed successfully"
            rm unsigned.pkg
          else
            echo "ERROR: PKG signing failed or timed out"
            exit 1
          fi

          echo "==> Signed PKG: $(ls -lh ${APP_NAME}.pkg)"

      - name: Upload .pkg to App Store Connect
        env:
          API_KEY_B64: ${{ secrets.APP_STORE_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APP_STORE_API_ISSUER }}
        run: |
          mkdir -p ~/.private_keys
          echo "$API_KEY_B64" | base64 --decode > ~/.private_keys/AuthKey_${API_KEY_ID}.p8

          echo "=== API Key file ==="
          file ~/.private_keys/AuthKey_${API_KEY_ID}.p8
          head -1 ~/.private_keys/AuthKey_${API_KEY_ID}.p8

          xcrun altool --upload-app --type macos \
            --file "${APP_NAME}.pkg" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER"

      - name: Upload .pkg as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TermaType-AppStore-pkg
          path: TermaType.pkg
