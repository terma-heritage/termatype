name: Mac App Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          brew install cmake
          npm ci

      - name: Import certificates and provisioning profile
        env:
          MAC_APP_DIST_CERTIFICATE: ${{ secrets.MAC_APP_DIST_CERTIFICATE }}
          MAC_APP_DIST_CERTIFICATE_PASSWORD: ${{ secrets.MAC_APP_DIST_CERTIFICATE_PASSWORD }}
          MAC_INSTALLER_CERTIFICATE: ${{ secrets.MAC_INSTALLER_CERTIFICATE }}
          MAC_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
          MAC_PROVISIONING_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
        run: |
          # Create and configure keychain
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -t 7200 -u build.keychain

          # Import Mac App Distribution cert
          echo "$MAC_APP_DIST_CERTIFICATE" | base64 --decode > mac_app.p12
          security import mac_app.p12 -k build.keychain -P "$MAC_APP_DIST_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm mac_app.p12

          # Import Mac Installer Distribution cert
          echo "$MAC_INSTALLER_CERTIFICATE" | base64 --decode > mac_installer.p12
          security import mac_installer.p12 -k build.keychain -P "$MAC_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          rm mac_installer.p12

          # Allow codesign and productbuild to access keychain without prompting
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild:,prod: -s -k actions build.keychain

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$MAC_PROVISIONING_PROFILE" | base64 --decode > src-tauri/TermaType_Mac_App_Store.provisionprofile
          echo "$MAC_PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/TermaType_Mac_App_Store.provisionprofile

          # Verify certs imported
          security find-identity -v build.keychain

      - name: Build x86_64
        timeout-minutes: 20
        run: |
          npm run tauri -- build --bundles app --target x86_64-apple-darwin \
            --config src-tauri/tauri.appstore.conf.json
        env:
          APPLE_SIGNING_IDENTITY: "3rd Party Mac Developer Application: Thupten Chakrishar (ETM8V4BA5N)"

      - name: Build aarch64
        timeout-minutes: 20
        run: |
          npm run tauri -- build --bundles app --target aarch64-apple-darwin \
            --config src-tauri/tauri.appstore.conf.json
        env:
          APPLE_SIGNING_IDENTITY: "3rd Party Mac Developer Application: Thupten Chakrishar (ETM8V4BA5N)"

      - name: Create universal binary
        run: |
          APP_X86="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/TermaType.app"
          APP_ARM="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/TermaType.app"
          UNIVERSAL_APP="TermaType.app"

          # Copy arm64 app as base
          cp -R "$APP_ARM" "$UNIVERSAL_APP"

          # Create universal binary with lipo
          lipo -create \
            "$APP_X86/Contents/MacOS/termatype" \
            "$APP_ARM/Contents/MacOS/termatype" \
            -output "$UNIVERSAL_APP/Contents/MacOS/termatype"

          # Embed provisioning profile
          cp src-tauri/TermaType_Mac_App_Store.provisionprofile "$UNIVERSAL_APP/Contents/embedded.provisionprofile"

          # Re-sign the universal app
          codesign --force --deep --sign "3rd Party Mac Developer Application: Thupten Chakrishar (ETM8V4BA5N)" \
            --entitlements src-tauri/Entitlements.plist \
            "$UNIVERSAL_APP"

          echo "Universal app created and signed"

      - name: Create .pkg
        timeout-minutes: 5
        run: |
          xcrun productbuild \
            --component "TermaType.app" /Applications \
            "TermaType.pkg"
          echo "PKG created: $(ls -lh TermaType.pkg)"

      - name: Upload .pkg to App Store Connect
        env:
          API_KEY: ${{ secrets.APP_STORE_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APP_STORE_API_ISSUER }}
        run: |
          mkdir -p ~/.private_keys
          echo "$API_KEY" > ~/.private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app --type macos \
            --file "TermaType.pkg" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER"

      - name: Upload .pkg as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TermaType-AppStore-pkg
          path: TermaType.pkg
